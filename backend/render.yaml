# Render configuration for backend only
# Use this if deploying backend as a separate service

services:
  - type: web
    name: artfully-lms-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: RENDER_EXTERNAL_URL
        value: https://artfully-lms.onrender.com
